{{- if .Values.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ printf "%s-external-secret" (include "color-app.fullname" .) | trunc 63 | trimSuffix "-" }}
  namespace: {{ include "color-app.namespace" . }}
  labels:
    {{- include "color-app.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecret.refreshInterval | quote }}
  secretStoreRef:
    {{- toYaml .Values.externalSecret.secretStoreRef | nindent 4 }}
  target:
    name: {{ .Values.externalSecret.target.name | quote }}
    creationPolicy: {{ .Values.externalSecret.target.creationPolicy }}
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}