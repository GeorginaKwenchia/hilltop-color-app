{{- if .Values.httpRoute.enabled -}}
{{- $routeName := printf "%s-route" (include "color-app.fullname" .) | trunc 63 | trimSuffix "-" -}}
{{- $svcPort := .Values.service.port -}}
{{- $serviceName := include "color-app.serviceName" . -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $routeName }}
  namespace: {{ include "color-app.namespace" . }}
  labels:
    {{- include "color-app.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- with .Values.httpRoute.parentRefs }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.httpRoute.rules }}
    {{- with .matches }}
    - matches:
      {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .filters }}
      filters:
      {{- toYaml . | nindent 8 }}
    {{- end }}
      backendRefs:
        - name: {{ $serviceName }}
          port: {{ $svcPort }}
          weight: 1
    {{- end }}
{{- end }}
